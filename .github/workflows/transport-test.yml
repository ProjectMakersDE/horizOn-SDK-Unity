name: Transport Test

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  transport-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run leaderboard transport contract
        run: dotnet run --project Tests~/TransportContract/TransportContract.csproj
