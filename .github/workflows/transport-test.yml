name: Transport Test

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read
  checks: write

jobs:
  shared-transport-contract:
    runs-on: [self-hosted, Linux, X64, proxmox-ci, horizon-sdk-ci]
    steps:
      # game-ci runs Unity as root in Docker and leaves root-owned files behind; hand them back first.
      - name: Reclaim workspace
        run: |
          if [ -d "$GITHUB_WORKSPACE" ] && find "$GITHUB_WORKSPACE" -mindepth 1 ! -user "$(id -u)" -print -quit | grep -q .; then
            docker run --rm -v "$GITHUB_WORKSPACE:/w" alpine:3.20 chown -R "$(id -u):$(id -g)" /w
          fi
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: 8.0.x

      - name: Run shared transport contract
        run: dotnet run --project Tests~/TransportContract/TransportContract.csproj

      - name: Check WebGL realtime bridge
        run: |
          node Tests~/WebGLRealtimeBridge.test.cjs
          node Tests~/WebGLChatStorage.test.cjs
