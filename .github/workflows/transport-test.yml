name: Transport Test

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read
  checks: write

jobs:
  shared-transport-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run shared transport contract
        run: dotnet run --project Tests~/TransportContract/TransportContract.csproj

      - name: Check WebGL realtime bridge
        run: node Tests~/WebGLRealtimeBridge.test.cjs

  unity-editor-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Import actual feature samples for executable sample regressions
        run: |
          mkdir -p .unity-ci-project/Assets/InboxSample
          cp Samples~/Examples/Features/InboxExample.cs .unity-ci-project/Assets/InboxSample/InboxExample.cs
          mkdir -p .unity-ci-project/Assets/AchievementsSample
          cp Samples~/Examples/Features/AchievementsExample.cs .unity-ci-project/Assets/AchievementsSample/AchievementsExample.cs
          mkdir -p .unity-ci-project/Assets/GroupsSample
          cp Samples~/Examples/Features/GroupsExample.cs Samples~/Examples/Features/GroupsSampleStore.cs .unity-ci-project/Assets/GroupsSample/
          mkdir -p .unity-ci-project/Assets/FriendsSample
          cp Samples~/Examples/Features/FriendsExample.cs .unity-ci-project/Assets/FriendsSample/FriendsExample.cs
          mkdir -p .unity-ci-project/Assets/ItemsSample
          cp Samples~/Examples/Features/ItemsExample.cs Samples~/Examples/Features/ItemsSampleStore.cs .unity-ci-project/Assets/ItemsSample/
          mkdir -p .unity-ci-project/Assets/SharedObjectsSample
          cp Samples~/Examples/Features/SharedObjectsExample.cs Samples~/Examples/Features/SharedObjectsSampleStore.cs .unity-ci-project/Assets/SharedObjectsSample/

      - name: Run actual Unity Editor transport tests
        id: unity-tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .unity-ci-project
          unityVersion: 6000.5.0f1
          testMode: EditMode
          # Every fixture tagged [Category("Transport")]: leaderboard, gift code, player profile and
          # the three validated actions suites. HorizonConfigApiKeyTests stays out (its legacy
          # ciphertext test depends on the machine), the E2E fixture needs a live backend.
          customParameters: -testCategory Transport
          artifactsPath: unity-editor-test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity Editor Transport Tests

      - name: Upload Unity Editor test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-editor-test-results
          path: ${{ steps.unity-tests.outputs.artifactsPath }}
