name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  issues: write
  pull-requests: write
  checks: write

jobs:
  transport-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run leaderboard transport contract
        run: dotnet run --project Tests~/TransportContract/TransportContract.csproj

  unity-editor-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Run actual Unity Editor transport tests
        id: unity-tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Tests/UnityProject
          unityVersion: 6000.5.0f1
          testMode: EditMode
          artifactsPath: unity-editor-test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity Editor Transport Tests

      - name: Upload Unity Editor test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-editor-test-results
          path: ${{ steps.unity-tests.outputs.artifactsPath }}

  release:
    runs-on: ubuntu-latest
    needs: [transport-test, unity-editor-transport]

    outputs:
      released: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install semantic-release plugins
        run: npm install -g semantic-release @semantic-release/changelog @semantic-release/git semantic-release-replace-plugin

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
            semantic-release-replace-plugin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release output
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          echo "New release published: ${{ steps.semantic.outputs.new_release_version }}"

      - name: Trigger changelog sync
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          gh api repos/ProjectMakersDE/horizOn-Changelog/dispatches \
            -f event_type=sync-changelog \
            -f 'client_payload[source]=unity-sdk'

      - name: Trigger example project update
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          gh api repos/ProjectMakersDE/horizOn-Example-Unity/dispatches \
            -f event_type=update-sdk \
            -f 'client_payload[version]=${{ steps.semantic.outputs.new_release_version }}'

  build:
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.released == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build .unitypackage
        run: |
          python3 .github/scripts/build-unitypackage.py \
            --output "horizOn-SDK-v${{ needs.release.outputs.version }}.unitypackage"
          ls -la horizOn-SDK-v${{ needs.release.outputs.version }}.unitypackage

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release.outputs.version }}
          files: horizOn-SDK-v${{ needs.release.outputs.version }}.unitypackage
